name: Registry

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate registry.txt
        run: python tools/make_registry.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- registry.txt; then
            echo "registry.txt is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.txt
          git commit -m "Update registry.txt."
          git push
